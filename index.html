<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a3a5c;--primary-light:#2d6da8;--primary-dark:#0f2740;
  --accent:#e8a838;--accent-hover:#d4942f;
  --bg:#f0f3f7;--card:#fff;--text:#1a2a3a;--text2:#6b7a8a;
  --border:#d8e0e8;--green:#2e8b57;--red:#c0392b;--radius:10px;
  --shadow:0 2px 12px rgba(0,0,0,.06);--shadow-hover:0 8px 28px rgba(0,0,0,.1);
  --sidebar-w:240px;--header-h:60px;--transition:.25s ease;
}
html{font-size:15px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden;
}
a{color:var(--primary-light);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c0c8d0;border-radius:3px}

/* ===== Sidebar ===== */
.sidebar{
  width:var(--sidebar-w);background:var(--primary);color:#fff;
  position:fixed;top:0;left:0;height:100vh;z-index:100;
  display:flex;flex-direction:column;transition:transform var(--transition);
}
.sidebar-header{
  padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;gap:10px;min-height:var(--header-w);
}
.sidebar-header .logo{
  width:34px;height:34px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:var(--primary);flex-shrink:0;
}
.sidebar-header h1{font-size:14px;font-weight:600;line-height:1.3}
.sidebar-header small{font-size:11px;opacity:.65;display:block}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 20px;
  cursor:pointer;transition:all var(--transition);color:rgba(255,255,255,.7);
  border-left:3px solid transparent;font-size:14px;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--accent)}
.nav-item .icon{font-size:18px;width:24px;text-align:center}
.nav-item .badge{
  margin-left:auto;background:var(--accent);color:var(--primary);
  font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600;
}
.sidebar-footer{
  padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);
  font-size:11px;opacity:.5;line-height:1.5;
}

/* ===== Main ===== */
.main{
  margin-left:var(--sidebar-w);flex:1;min-height:100vh;
  display:flex;flex-direction:column;
}
.topbar{
  height:var(--header-h);background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:50;
}
.topbar h2{font-size:16px;font-weight:600}
.topbar .breadcrumb{margin-left:12px;font-size:12px;color:var(--text2)}
.menu-toggle{display:none;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text);margin-right:12px;padding:4px}
.content{padding:28px;flex:1}

/* ===== Page Sections ===== */
.page{display:none;animation:fadeIn .35s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== Dashboard ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat-card{
  background:var(--card);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.stat-card .label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .sub{font-size:12px;color:var(--text2);margin-top:4px}
.stat-card .icon-bg{
  float:right;width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.company-card{
  background:var(--card);border-radius:var(--radius);padding:24px;
  box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:24px;
}
.company-card h3{font-size:16px;margin-bottom:8px}
.company-card p{font-size:13px;color:var(--text2);line-height:1.7}
.company-info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.company-info-item{font-size:13px}
.company-info-item strong{display:block;color:var(--primary);margin-bottom:2px}
.company-info-item span{color:var(--text2)}

/* ===== Keywords Page ===== */
.keyword-categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.kw-cat-btn{
  padding:8px 18px;border-radius:20px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;font-size:13px;
  transition:all var(--transition);color:var(--text2);
}
.kw-cat-btn:hover{border-color:var(--primary-light);color:var(--primary-light)}
.kw-cat-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.kw-search{
  width:100%;padding:10px 16px;border:2px solid var(--border);border-radius:var(--radius);
  font-size:14px;margin-bottom:16px;transition:border-color var(--transition);
  outline:none;background:var(--card);
}
.kw-search:focus{border-color:var(--primary-light)}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.kw-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--border);
  padding:8px 14px;border-radius:8px;font-size:13px;transition:all var(--transition);
}
.kw-tag:hover{border-color:var(--primary-light);box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.kw-tag .kw-num{color:var(--text2);font-size:11px;background:var(--bg);padding:0 6px;border-radius:4px}
.kw-category-header{
  background:var(--card);border-radius:var(--radius);padding:16px 20px;
  border:1px solid var(--border);margin-bottom:14px;display:flex;
  justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.kw-category-header .title{font-weight:600;font-size:14px}
.kw-category-header .desc{font-size:12px;color:var(--text2)}
.kw-count{font-size:12px;color:var(--text2)}

/* ===== Content Generator ===== */
.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.gen-grid{grid-template-columns:1fr}}
.gen-config{
  background:var(--card);border-radius:var(--radius);padding:24px;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.gen-config h3{font-size:15px;margin-bottom:16px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.form-group select,.form-group textarea{
  width:100%;padding:10px 14px;border:2px solid var(--border);
  border-radius:8px;font-size:14px;outline:none;transition:border-color var(--transition);
  background:var(--card);font-family:inherit;
}
.form-group select:focus,.form-group textarea:focus{border-color:var(--primary-light)}
.form-group textarea{min-height:80px;resize:vertical}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 24px;
  border:none;border-radius:8px;font-size:14px;font-weight:600;
  cursor:pointer;transition:all var(--transition);
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,58,92,.3)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-accent{background:var(--accent);color:var(--primary-dark)}
.btn-accent:hover{background:var(--accent-hover)}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary-light);color:var(--primary-light)}
.btn-sm{padding:6px 14px;font-size:12px}
.gen-result{
  background:var(--card);border-radius:var(--radius);padding:24px;
  box-shadow:var(--shadow);border:1px solid var(--border);
  min-height:300px;position:relative;
}
.gen-result .empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:250px;color:var(--text2);text-align:center;
}
.gen-result .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.4}
.gen-result .empty-state p{font-size:14px;max-width:280px;line-height:1.6}
.result-title{
  font-size:15px;font-weight:600;margin-bottom:12px;padding:12px 16px;
  background:var(--bg);border-radius:8px;border-left:4px solid var(--accent);
}
.result-section{margin-bottom:16px}
.result-section h4{
  font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:6px;
}
.result-section .body{
  font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;
  padding:12px;background:var(--bg);border-radius:8px;max-height:300px;overflow-y:auto;
}
.result-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.result-meta .tag{
  font-size:11px;padding:3px 10px;border-radius:12px;background:var(--bg);color:var(--text2);
}

/* ===== Content Browser ===== */
.browser-controls{
  background:var(--card);border-radius:var(--radius);padding:16px 20px;
  box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px;
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
}
.browser-controls select{padding:8px 14px;border:2px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--card)}
.browser-controls select:focus{border-color:var(--primary-light)}
.browser-controls .result-count{font-size:12px;color:var(--text2);margin-left:auto}
.content-list{display:grid;gap:16px}
.content-item{
  background:var(--card);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);border:1px solid var(--border);
  cursor:pointer;transition:all var(--transition);
}
.content-item:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--primary-light)}
.content-item .ci-header{
  display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;
}
.content-item .ci-product{
  font-weight:600;font-size:14px;color:var(--primary);
}
.content-item .ci-platform{
  font-size:11px;padding:2px 10px;border-radius:10px;background:var(--bg);
  color:var(--text2);white-space:nowrap;
}
.content-item .ci-title{font-size:13px;color:var(--text2);margin-bottom:4px;line-height:1.5}
.content-item .ci-preview{
  font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ===== Platform Strategy ===== */
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.strat-card{
  background:var(--card);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.strat-card .sc-icon{font-size:28px;margin-bottom:8px}
.strat-card h4{font-size:14px;margin-bottom:4px}
.strat-card .sc-meta{font-size:12px;color:var(--text2);margin-bottom:8px;line-height:1.6}
.strat-card .sc-tags{display:flex;flex-wrap:wrap;gap:4px}
.strat-card .sc-tags span{
  font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--text2);
}

/* ===== Modal ===== */
.modal-overlay{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.45);z-index:200;justify-content:center;align-items:center;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--card);border-radius:var(--radius);width:90%;max-width:640px;
  max-height:80vh;overflow-y:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2);
  animation:fadeIn .25s ease;
}
.modal-close{
  float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text2);
}
.modal-close:hover{color:var(--text)}
.modal h3{font-size:16px;margin-bottom:16px}
.modal .body{font-size:13px;line-height:1.7;white-space:pre-wrap}

/* ===== Loading Spinner ===== */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:28px;right:28px;background:var(--primary);color:#fff;
  padding:12px 20px;border-radius:8px;font-size:13px;z-index:300;
  box-shadow:0 4px 20px rgba(0,0,0,.2);animation:slideIn .3s ease;
  display:flex;align-items:center;gap:8px;
}
.toast.error{background:var(--red)}
.toast.success{background:var(--green)}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ===== Responsive ===== */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .menu-toggle{display:block}
  .content{padding:16px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .gen-grid{grid-template-columns:1fr}
  .topbar{padding:0 16px}
}

/* ===== Other ===== */
.copy-btn{float:right;padding:4px 12px;font-size:11px;cursor:pointer;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text2);transition:all var(--transition)}
.copy-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.empty-state-big{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state-big .icon{font-size:56px;margin-bottom:12px;opacity:.3}
.empty-state-big p{font-size:15px;line-height:1.6;max-width:400px;margin:0 auto}
.thinking-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:#fef3e2;color:#a0691a;padding:6px 14px;border-radius:20px;
  font-size:12px;margin-bottom:14px;
}
</style>

function collectKeywords(product) {
  const all=[];
  for(const kw of Object.values(KEYWORDS)){
    const matched=kw.filter(w=>product?w.includes(product.replace(/[号型]/g,'').trim())||product.includes(w.replace(/[号型]/g,'').trim()):true);
    all.push(...matched.slice(0,4));
  }
  return [...new Set(all)].slice(0,15);
}

// ---- Generator ----
function renderGenerator(el) {
  el.innerHTML=`
    <div class="gen-grid">
      <div class="gen-config">
        <h3>⚙️ 内容配置</h3>
        <div class="form-group">
          <label>选择产品</label>
          <select id="genProduct">${COMPANY.products.map(p=>`<option value="${p}">${p}</option>`).join('')}</select>
        </div>

          <label>选择平台</label>
          <select id="genPlatform">${PLATFORMS.map(p=>`<option value="${p.id}">${p.icon} ${p.name}</option>`).join('')}</select>

          <textarea id="genExtra" placeholder="示例：突出价格优势，强调现货供应…"></textarea>

        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="doGenerate()"><span id="genBtnIcon">✨</span> <span id="genBtnText">AI 深度生成</span></button>
          <button class="btn btn-outline" onclick="doGenerate();this.innerHTML='已加入批量'">📋 加入批量</button>

          <p>选择产品和平台后点击「AI 深度生成」<br>系统将模拟 DeepSeek 深度思考流程<br>分析用户意图 → 制定内容策略 → 输出标题和文案</p>

function doGenerate() {
  const product=document.getElementById('genProduct')?.value || COMPANY.products[0];
  const platform=document.getElementById('genPlatform')?.value || '1688';
  const extra=document.getElementById('genExtra')?.value || '';
  
  const resultEl=document.getElementById('genResult');
  resultEl.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px"><div class="spinner" style="width:32px;height:32px;border-color:#d8e0e8;border-top-color:var(--primary);margin-bottom:16px"></div><p style="color:var(--text2);font-size:14px">DeepSeek 深度思考中<span class="loading-dots"></span></p><p style="color:var(--text2);font-size:12px;margin-top:4px">分析用户意图 · 制定内容策略 · 生成营销文案</p></div>`;
  
  setTimeout(()=>{
    const result=generateContent(product,platform);
    if(extra)result.copy+='\n\n【附加指令】'+extra;
    generatedCache.push(result);
    displayResult(result,resultEl);
  },800);
}

function displayResult(result,el) {
  const platformInfo=PLATFORMS.find(p=>p.id===result.platform)||{icon:'📄',name:result.platformName};
  el.innerHTML=`
    <div class="thinking-badge">🧠 DeepSeek 深度思考 · ${result.platformName}</div>
    <div class="result-meta">
      <span class="tag">📦 ${result.product}</span>
      <span class="tag">${platformInfo.icon} ${result.platformName}</span>
      <span class="tag">🔑 ${result.keywords.length} 个关联词</span>
    </div>
    <div class="result-section">
      <h4>🎯 深度思考分析</h4>
      <div class="body" style="max-height:180px;background:#fefcf5;font-size:12px">${result.thinking.replace(/\n/g,'<br>')}</div>
    </div>
    <div class="result-title">${result.title}</div>
    <div class="result-section">
      <h4>📝 完整文案</h4>
      <div class="body">${result.copy}</div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn btn-primary btn-sm" onclick="copyText(\`${result.title}\n\n${result.copy.replace(/`/g,'\\`')}\`)">📋 复制全部</button>

function batchGenerateAll() {
  const resultEl=document.getElementById('genResult');
  resultEl.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px"><div class="spinner" style="width:32px;height:32px;border-color:#d8e0e8;border-top-color:var(--primary);margin-bottom:16px"></div><p style="color:var(--text2);font-size:14px">批量生成中…</p><p style="color:var(--text2);font-size:12px;margin-top:4px">为全部 ${COMPANY.products.length} 产品 × ${PLATFORMS.length} 平台生成内容</p></div>`;
  
  setTimeout(()=>{
    const all=[];
    for(const p of COMPANY.products){
      for(const pl of PLATFORMS){
        const r=generateContent(p,pl.id);
        r._batchId=`${p}-${pl.id}`;
        all.push(r);
      }
    }
    generatedCache=all;
    resultEl.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;color:var(--green)">
      <div style="font-size:48px;margin-bottom:12px">✅</div>
      <p style="font-size:16px;font-weight:600">批量生成完成！</p>
      <p style="color:var(--text2);margin-top:4px">共 ${all.length} 条内容（${COMPANY.products.length}产品 × ${PLATFORMS.length}平台）</p>
      <button class="btn btn-primary" style="margin-top:16px" onclick="switchPage('browser')">📄 查看全部内容</button>
    </div>`;
  },1200);
}

// ---- Browser ----
function renderBrowser(el) {
  if(generatedCache.length===0){
    // 预置数据
    for(const p of COMPANY.products.slice(0,5)){
      for(const pl of PLATFORMS.slice(0,4)){
        const r=generateContent(p,pl.id);
        r._batchId=`${p}-${pl.id}`;
        generatedCache.push(r);
      }
    }
  }
  
  el.innerHTML=`
    <div class="browser-controls">
      <select id="bFilterProduct" onchange="filterBrowser()"><option value="">全部产品</option>${COMPANY.products.map(p=>`<option value="${p}">${p}</option>`).join('')}</select>
      <select id="bFilterPlatform" onchange="filterBrowser()"><option value="">全部平台</option>${PLATFORMS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
      <input style="flex:1;min-width:120px;padding:8px 14px;border:2px solid var(--border);border-radius:8px;font-size:13px;outline:none" placeholder="🔍 搜索内容..." id="bFilterSearch" oninput="filterBrowser()">
      <span class="result-count" id="bResultCount">${generatedCache.length} 条</span>
    </div>
    <div class="content-list" id="bList"></div>
  `;
  filterBrowser();
}

function filterBrowser() {
  const product=document.getElementById('bFilterProduct')?.value||'';
  const platform=document.getElementById('bFilterPlatform')?.value||'';
  const search=document.getElementById('bFilterSearch')?.value||'';
  
  let filtered=generatedCache.filter(r=>{
    if(product && r.product!==product)return false;
    if(platform && r.platform!==platform)return false;
    if(search && !r.title.includes(search) && !r.product.includes(search) && !(r.copy||'').includes(search))return false;
    return true;
  });
  
  const countEl=document.getElementById('bResultCount');
  if(countEl)countEl.textContent=filtered.length+' 条';
  
  const list=document.getElementById('bList');
  if(!list)return;
  
  if(filtered.length===0){
    list.innerHTML='<div class="empty-state-big"><div class="icon">🔍</div><p>没有匹配的内容<br>试试调整筛选条件</p></div>';
    return;
  }
  
  const platformMap=Object.fromEntries(PLATFORMS.map(p=>[p.id,p]));
  list.innerHTML=filtered.map(r=>{
    const pi=platformMap[r.platform]||{icon:'📄',name:r.platformName||r.platform};
    return `<div class="content-item" onclick="showContentDetail('${r._batchId||r.product+'-'+r.platform}')">
      <div class="ci-header">
        <div class="ci-product">📦 ${r.product}</div>
        <div class="ci-platform">${pi.icon} ${pi.name||r.platformName||r.platform}</div>
      </div>
      <div class="ci-title">${r.title}</div>
      <div class="ci-preview">${(r.copy||'').substring(0,120)}…</div>
    </div>`;
  }).join('');
}

function showContentDetail(id) {
  const item=generatedCache.find(r=>r._batchId===id);
  if(!item)return;
  const pi=PLATFORMS.find(p=>p.id===item.platform)||{icon:'📄',name:item.platformName};
  document.getElementById('modalContent').innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3>${pi.icon} ${item.product} · ${pi.name}</h3>
    <div class="result-meta">
      <span class="tag">📦 ${item.product}</span>
      <span class="tag">🔑 ${item.keywords.length} 个关联词</span>
    </div>
    <div class="thinking-badge" style="margin-top:12px">🧠 深度思考分析</div>
    <div class="body" style="font-size:12px;background:#fefcf5;margin-bottom:16px">${item.thinking.replace(/\n/g,'<br>')}</div>
    <div class="result-title">${item.title}</div>
    <div class="body" style="margin-top:12px">${item.copy}</div>
    <div style="margin-top:16px">
      <button class="btn btn-primary btn-sm" onclick="copyText(\`${item.title}\n\n${item.copy.replace(/`/g,'\\`')}\`)">📋 复制全部</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

// ================================================================
// 工具函数

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

function copyText(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>showToast('已复制到剪贴板','success')).catch(()=>fallbackCopy(text));
  }else{fallbackCopy(text)}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast('已复制到剪贴板','success')}catch(e){showToast('复制失败，请手动复制','error')}
  document.body.removeChild(ta);
}

let toastTimer;
function showToast(msg,type='success'){
  if(toastTimer)clearTimeout(toastTimer);
  const existing=document.querySelector('.toast');if(existing)existing.remove();
  const t=document.createElement('div');t.className='toast '+type;
  t.innerHTML=`<span>${type==='success'?'✅':'❌'}</span>${msg}`;
  document.body.appendChild(t);
  toastTimer=setTimeout(()=>t.remove(),2500);
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('open')}

document.addEventListener('DOMContentLoaded',()=>{

});

document.getElementById('content')?.addEventListener('click',()=>{
