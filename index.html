<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兆辉防腐 · 全网获客作战台</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="brand-text">
          <strong>兆辉防腐</strong>
          <small>全网获客作战台</small>
        </div>
      </div>
      <nav class="nav-list" aria-label="主导航">
        <button class="nav-item is-active" data-view="overview" type="button">
          <i data-lucide="gauge"></i><span>全局驾驶舱</span>
        </button>
        <button class="nav-item" data-view="platforms" type="button">
          <i data-lucide="layout-grid"></i><span>平台矩阵</span>
        </button>
        <button class="nav-item" data-view="content" type="button">
          <i data-lucide="sparkles"></i><span>内容工厂</span>
        </button>
        <button class="nav-item" data-view="schedule" type="button">
          <i data-lucide="calendar-range"></i><span>排期作战台</span>
        </button>
        <button class="nav-item" data-view="leads" type="button">
          <i data-lucide="users"></i><span>线索池</span>
        </button>
        <button class="nav-item" data-view="assets" type="button">
          <i data-lucide="box"></i><span>素材软件库</span>
        </button>
        <button class="nav-item" data-view="data" type="button">
          <i data-lucide="chart-no-axes-combined"></i><span>数据复盘</span>
        </button>
        <button class="nav-item" data-view="live" type="button">
          <i data-lucide="radio"></i><span>实时情报</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <button class="nav-item ghost" data-view="settings" type="button" id="open-settings">
          <i data-lucide="settings"></i><span>参数设置</span>
        </button>
        <div class="sidebar-note" id="sidebar-note"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title">全局驾驶舱</h1>
          <p id="view-subtitle">本周运营态势</p>
        </div>
        <div class="topbar-actions">
          <div class="today-chip" id="today-chip"></div>
          <button class="btn btn-ghost" type="button" id="print-btn">
            <i data-lucide="printer"></i><span>导出</span>
          </button>
          <button class="btn btn-primary" type="button" id="open-settings-2">
            <i data-lucide="settings"></i><span>参数设置</span>
          </button>
        </div>
      </header>

      <div class="content" id="content">
        <section class="view" id="view-overview" data-view="overview"></section>
        <section class="view" id="view-platforms" data-view="platforms" hidden></section>
        <section class="view" id="view-content" data-view="content" hidden></section>
        <section class="view" id="view-schedule" data-view="schedule" hidden></section>
        <section class="view" id="view-leads" data-view="leads" hidden></section>
        <section class="view" id="view-assets" data-view="assets" hidden></section>
        <section class="view" id="view-data" data-view="data" hidden></section>
        <section class="view" id="view-live" data-view="live" hidden></section>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="settings-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title">参数设置</h2>
        <button class="icon-btn" type="button" id="close-settings" aria-label="关闭">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="settings-form" class="settings-form" data-form="settings-form">
        <label class="field">
          <span>公司简称</span>
          <input type="text" name="company" placeholder="兆辉防腐">
        </label>
        <label class="field">
          <span>主营产品 / 服务</span>
          <input type="text" name="products" placeholder="储罐内壁防腐、管道防腐、地坪防腐">
        </label>
        <label class="field">
          <span>联系电话</span>
          <input type="text" name="phone" placeholder="13800000000">
        </label>
        <label class="field">
          <span>微信号 / 企业微信</span>
          <input type="text" name="wechat" placeholder="zhaohui-fangfu">
        </label>
        <label class="field">
          <span>官网 / 落地页</span>
          <input type="text" name="website" placeholder="https://example.com">
        </label>
        <label class="field">
          <span>DeepSeek API Key</span>
          <input type="password" name="deepseekApiKey" placeholder="sk-...">
        </label>
        <label class="field">
          <span>DeepSeek API 地址</span>
          <input type="text" name="deepseekBaseUrl" placeholder="https://api.deepseek.com">
        </label>
        <label class="field">
          <span>DeepSeek 模型</span>
          <input type="text" name="deepseekModel" placeholder="deepseek-chat">
        </label>
        <div class="modal-actions">
          <button class="btn btn-danger" type="button" data-action="reset-demo">重置示例数据</button>
          <button class="btn btn-primary" type="submit" data-action="submit-form">
            <i data-lucide="check"></i><span>保存参数</span>
          </button>
          <button class="btn btn-ghost" type="button" id="cancel-settings">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
